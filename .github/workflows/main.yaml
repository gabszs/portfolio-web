name: Production CI

on:
  push:
    branches: ["main"]

# Necessario para o push do bump de tag na branch gitops
permissions:
  contents: write

env:
  IMAGE_NAME: gabzsz/portfolio-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 traz todas as branches — sem isso o checkout da gitops
      # mais abaixo nao encontra a ref
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve image tag from commit SHA
        run: echo "TAG=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Update image tag on gitops branch
        run: |
          set -euo pipefail
          git config user.email "ci-bot@ci.com"
          git config user.name "CI Bot"
          git fetch origin gitops
          git checkout -B gitops origin/gitops

          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${TAG}|" k8s/deployment.yaml

          if git diff --quiet k8s/deployment.yaml; then
            echo "::error::sed nao alterou k8s/deployment.yaml — confira se a linha 'image: ${IMAGE_NAME}:' existe"
            exit 1
          fi

          git add k8s/deployment.yaml
          git commit -m "chore(deploy): image ${TAG}"
          git push origin gitops

